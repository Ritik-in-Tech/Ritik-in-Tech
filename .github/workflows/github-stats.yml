name: GitHub Stats and Snake Generation

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC for stats
    - cron: "0 */12 * * *" # Every 12 hours for snake generation
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        env:
          GH_STATS_PAT: ${{ secrets.GH_STATS_PAT }}
        run: |
          curl -o github-stats.svg "https://github-readme-stats.vercel.app/api?username=Ritik-in-Tech&theme=dark&hide_border=false&include_all_commits=false&count_private=true&token=${GH_STATS_PAT}"

          curl -o streak-stats.svg "https://github-readme-streak-stats.herokuapp.com/?user=Ritik-in-Tech&theme=dark&hide_border=false&token=${GH_STATS_PAT}"

          curl -o top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=Ritik-in-Tech&theme=dark&hide_border=false&include_all_commits=false&count_private=true&layout=compact&token=${GH_STATS_PAT}"

      - name: Commit and Push Stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg streak-stats.svg top-langs.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          exit 0
          fi
          git commit -m "🔄 Updated GitHub Stats"
          # Retry push with rebase in case main moved while we were generating SVGs
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 5))
          done
          echo "Push failed after 3 attempts"
          exit 1

  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: "Ritik-in-Tech"
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
